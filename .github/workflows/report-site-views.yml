name: Report site views

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query site and QR analytics and send Telegram report
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          QR_STATS_SECRET: ${{ secrets.QR_STATS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.LIONTIME_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.LIONTIME_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          api="https://api.vercel.com/v1/query/web-analytics/visits/count"
          qr_stats_api="https://www.lionhour.com/api/qr-stats"

          fetch() {
            local response http_code body
            response=$(curl --silent --show-error \
              --retry 3 --retry-all-errors \
              -w '\n%{http_code}' \
              --get "$api" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              --data-urlencode "projectId=$VERCEL_PROJECT_ID" \
              "$@")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" -ge 400 ]; then
              echo "Vercel API error (HTTP $http_code): $body" >&2
              return 1
            fi
            echo "$body"
          }

          now_s=$(date +%s)
          now_ms=$(( now_s * 1000 ))
          six_h_ago_ms=$(( (now_s - 6 * 3600) * 1000 ))
          twenty_four_h_ago_ms=$(( (now_s - 24 * 3600) * 1000 ))
          thirty_days_ago_ms=$(( (now_s - 30 * 86400) * 1000 ))

          # Last 30 days (hobby plan limit is 31 days)
          last_30d=$(fetch \
            --data-urlencode "since=$thirty_days_ago_ms" \
            --data-urlencode "until=$now_ms")
          VIEWS_30D=$(jq '.data.pageviews // 0' <<< "$last_30d")
          VISITORS_30D=$(jq '.data.visitors // 0' <<< "$last_30d")

          # Last 24 hours
          last_24h=$(fetch \
            --data-urlencode "since=$twenty_four_h_ago_ms" \
            --data-urlencode "until=$now_ms")
          VIEWS_24H=$(jq '.data.pageviews // 0' <<< "$last_24h")
          VISITORS_24H=$(jq '.data.visitors // 0' <<< "$last_24h")

          # Last 6 hours
          last_6h=$(fetch \
            --data-urlencode "since=$six_h_ago_ms" \
            --data-urlencode "until=$now_ms")
          VIEWS_6H=$(jq '.data.pageviews // 0' <<< "$last_6h")
          VISITORS_6H=$(jq '.data.visitors // 0' <<< "$last_6h")

          # QR poster totals. Keep the normal site report available if this source fails.
          qr_section=$(printf '%s\n%s' "QR Poster Scans" "QR scan report unavailable")
          if [[ -n "$QR_STATS_SECRET" ]]; then
            if qr_stats=$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $QR_STATS_SECRET" \
              "$qr_stats_api"); then
              if qr_lines=$(jq -er '
                if ((.posters | type) == "array")
                  and (([.posters[].id] | sort) == ["butler", "dining", "dodge", "feedback", "ferris", "hewitt", "orientation", "plug"])
                  and all(.posters[];
                    ((.label | type) == "string")
                    and ((.allTime | type) == "number")
                    and ((.today | type) == "number")
                    and (.allTime >= 0)
                    and (.today >= 0))
                then .posters
                  | map("\(.label): \(.allTime) total · \(.today) today")
                  | join("\n")
                else error("invalid QR stats response")
                end
              ' <<< "$qr_stats"); then
                qr_section=$(printf '%s\n%s' "QR Poster Scans" "$qr_lines")
              else
                echo "QR stats response failed validation; sending site report without QR totals" >&2
              fi
            else
              echo "QR stats request failed; sending site report without QR totals" >&2
            fi
          else
            echo "QR_STATS_SECRET is not configured; sending site report without QR totals" >&2
          fi

          # Format report
          report_time=$(TZ='America/New_York' date '+%b %-d, %Y %-I:%M %p ET')

          message=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n\n%s' \
            "LionHour Site Views Report" \
            "Last 6 hours: $VIEWS_6H views ($VISITORS_6H visitors)" \
            "Last 24 hours: $VIEWS_24H views ($VISITORS_24H visitors)" \
            "Last 30 days: $VIEWS_30D views ($VISITORS_30D visitors)" \
            "$qr_section" \
            "Generated: $report_time")

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"
