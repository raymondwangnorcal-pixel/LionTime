name: Update student services hours

on:
  schedule:
    - cron: '57 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-student-services-hours
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Student Life pipeline
        run: >-
          node --test
          tests/student-services-hours-acquire.test.mjs
          tests/student-services-source-parser.test.mjs
          tests/student-services-hours-resolver.test.mjs
          tests/student-services-hours-schema.test.mjs
          tests/student-services-hours-service.test.mjs
          tests/student-services-hours-scraper.test.mjs
          tests/student-services-hours-workflow.test.mjs
          tests/student-services-hours-client.test.mjs
          tests/student-services-hours-view.test.mjs
          tests/student-services-hours-ui.test.mjs
      - name: Scrape validated Student Life hours
        run: xvfb-run --auto-servernum node scripts/student-services-hours-scraper.mjs --json-out "$RUNNER_TEMP/student-services-hours.json"
      - name: Publish validated attempt batch
        if: vars.STUDENT_SERVICES_HOURS_PUBLISH_ENABLED == 'true' && vars.STUDENT_SERVICES_HOURS_API_URL != ''
        env:
          UPDATE_SECRET: ${{ secrets.LIBRARY_HOURS_UPDATE_SECRET }}
          API_URL: ${{ vars.STUDENT_SERVICES_HOURS_API_URL }}
        run: >-
          test -n "$UPDATE_SECRET" &&
          curl --fail-with-body --silent --show-error
          --retry 3 --retry-all-errors
          -X PUT "$API_URL"
          -H "Authorization: Bearer $UPDATE_SECRET"
          -H "Content-Type: application/json"
          --data-binary "@$RUNNER_TEMP/student-services-hours.json"
