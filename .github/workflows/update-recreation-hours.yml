name: Update recreation hours

on:
  schedule:
    - cron: '27 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-recreation-hours
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      notification_summary: ${{ steps.notification-summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Recreation pipeline
        run: >-
          node --test
          tests/recreation-hours-acquire.test.mjs
          tests/recreation-source-parser.test.mjs
          tests/recreation-hours-resolver.test.mjs
          tests/recreation-hours-schema.test.mjs
          tests/recreation-hours-service.test.mjs
          tests/recreation-hours-scraper.test.mjs
          tests/recreation-hours-workflow.test.mjs
      - name: Scrape validated Recreation hours
        id: scrape
        env:
          SCRAPE_EVIDENCE_DIR: ${{ runner.temp }}/scrape/recreation
        run: xvfb-run --auto-servernum node scripts/recreation-hours-scraper.mjs --json-out "$RUNNER_TEMP/recreation-hours.json"
      # Evidence for the next parser fix (docs/automated-fix.md §3.1): the per-source
      # manifest plus the raw page of any source that failed. Uploaded on every
      # outcome, kept 14 days, never committed.
      - name: Upload scrape manifest and evidence
        if: ${{ always() && steps.scrape.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: scrape-manifest-recreation
          path: ${{ runner.temp }}/scrape/recreation
          retention-days: 14
          if-no-files-found: warn
      - name: Format notification summary
        id: notification-summary
        env:
          PUBLISH_ENABLED: ${{ vars.RECREATION_HOURS_PUBLISH_ENABLED }}
        run: |
          summary="$(node scripts/workflow-notification-summary.mjs --kind recreation --input "$RUNNER_TEMP/recreation-hours.json" --publish-enabled "${PUBLISH_ENABLED:-false}")"
          {
            echo 'summary<<EOF'
            echo "$summary"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # `--fail-with-body` does not fail on a 3xx and curl does not follow one, so when
      # www.lionhour.com began 308-redirecting to the apex on 2026-09-10 every PUT became a
      # silent no-op that still went green. Read the status code; accept nothing but a 2xx.
      - name: Publish validated snapshot
        if: vars.RECREATION_HOURS_PUBLISH_ENABLED == 'true' && vars.RECREATION_HOURS_API_URL != ''
        env:
          UPDATE_SECRET: ${{ secrets.LIBRARY_HOURS_UPDATE_SECRET }}
          API_URL: ${{ vars.RECREATION_HOURS_API_URL }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SECRET"
          body="$RUNNER_TEMP/publish-response.txt"
          code=$(curl --silent --show-error --retry 3 --retry-all-errors \
            -o "$body" -w '%{http_code}' \
            -X PUT "$API_URL" \
            -H "Authorization: Bearer $UPDATE_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/recreation-hours.json") || code=transport-error
          case "$code" in
            2??) echo "Published: HTTP $code" ;;
            3??) echo "::error::$API_URL answered HTTP $code. curl does not follow redirects, so nothing was published — point RECREATION_HOURS_API_URL at the apex domain."; exit 1 ;;
            *) echo "::error::Publish failed: HTTP $code from $API_URL"; cat "$body" || true; exit 1 ;;
          esac
      # The publish step proves the request was accepted; this proves the site is serving it.
      - name: Verify the site is serving this run's snapshot
        if: vars.RECREATION_HOURS_PUBLISH_ENABLED == 'true' && vars.RECREATION_HOURS_API_URL != ''
        env:
          API_URL: ${{ vars.RECREATION_HOURS_API_URL }}
        run: >-
          node scripts/verify-published-snapshot.mjs
          --kind recreation
          --local "$RUNNER_TEMP/recreation-hours.json"
          --api-url "$API_URL"
  notify:
    needs: scrape-and-publish
    if: ${{ always() }}
    uses: ./.github/workflows/send-telegram-update.yml
    with:
      source_label: Recreation
      conclusion: ${{ needs.scrape-and-publish.result }}
      summary: ${{ needs.scrape-and-publish.outputs.notification_summary }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      telegram_bot_token: ${{ secrets.LIONTIME_TELEGRAM_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.LIONTIME_TELEGRAM_CHAT_ID }}
