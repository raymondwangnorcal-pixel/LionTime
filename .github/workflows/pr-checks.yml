name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Three tests drive a real browser (favicon, Vercel analytics, Barnard DOM parse).
      - run: npx playwright install --with-deps chromium
      - run: npm test
