name: Update library hours

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-library-hours
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      notification_summary: ${{ steps.notification-summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test scraper
        run: python -m unittest tests/test_scrape.py -v
      - name: Scrape current library hours
        id: scrape
        env:
          SCRAPE_EVIDENCE_DIR: ${{ runner.temp }}/scrape/library
        run: python scrape.py --json-out "$RUNNER_TEMP/library-hours.json"
      # Evidence for the next parser fix (docs/automated-fix.md §3.1): the per-source
      # manifest plus the raw page of any source that failed. Uploaded on every
      # outcome, kept 14 days, never committed.
      - name: Upload scrape manifest and evidence
        if: ${{ always() && steps.scrape.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: scrape-manifest-library
          path: ${{ runner.temp }}/scrape/library
          retention-days: 14
          if-no-files-found: warn
      - name: Format notification summary
        id: notification-summary
        env:
          PUBLISH_ENABLED: ${{ vars.LIBRARY_HOURS_PUBLISH_ENABLED }}
        run: |
          summary="$(node scripts/workflow-notification-summary.mjs --kind library --input "$RUNNER_TEMP/library-hours.json" --publish-enabled "${PUBLISH_ENABLED:-false}")"
          {
            echo 'summary<<EOF'
            echo "$summary"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # `--fail-with-body` does not fail on a 3xx and curl does not follow one, so when
      # www.lionhour.com began 308-redirecting to the apex on 2026-09-10 every PUT became a
      # silent no-op that still went green. Read the status code; accept nothing but a 2xx.
      - name: Publish validated snapshot
        if: vars.LIBRARY_HOURS_PUBLISH_ENABLED == 'true'
        env:
          UPDATE_SECRET: ${{ secrets.LIBRARY_HOURS_UPDATE_SECRET }}
          API_URL: ${{ vars.LIBRARY_HOURS_API_URL }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/publish-response.txt"
          code=$(curl --silent --show-error --retry 3 --retry-all-errors \
            -o "$body" -w '%{http_code}' \
            -X PUT "$API_URL" \
            -H "Authorization: Bearer $UPDATE_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/library-hours.json") || code=transport-error
          case "$code" in
            2??) echo "Published: HTTP $code" ;;
            3??) echo "::error::$API_URL answered HTTP $code. curl does not follow redirects, so nothing was published — point LIBRARY_HOURS_API_URL at the apex domain."; exit 1 ;;
            *) echo "::error::Publish failed: HTTP $code from $API_URL"; cat "$body" || true; exit 1 ;;
          esac
      # The publish step proves the request was accepted; this proves the site is serving it.
      - name: Verify the site is serving this run's snapshot
        if: vars.LIBRARY_HOURS_PUBLISH_ENABLED == 'true'
        env:
          API_URL: ${{ vars.LIBRARY_HOURS_API_URL }}
        run: >-
          node scripts/verify-published-snapshot.mjs
          --kind library
          --local "$RUNNER_TEMP/library-hours.json"
          --api-url "$API_URL"
  notify:
    needs: scrape-and-publish
    if: ${{ always() }}
    uses: ./.github/workflows/send-telegram-update.yml
    with:
      source_label: Library
      conclusion: ${{ needs.scrape-and-publish.result }}
      summary: ${{ needs.scrape-and-publish.outputs.notification_summary }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      telegram_bot_token: ${{ secrets.LIONTIME_TELEGRAM_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.LIONTIME_TELEGRAM_CHAT_ID }}
