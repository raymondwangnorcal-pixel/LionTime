name: Update dining hours

on:
  schedule:
    - cron: '47 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dining-hours
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    if: github.repository == 'raymondwangnorcal-pixel/LionTime' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, lionhour-dining]
    timeout-minutes: 15
    outputs:
      notification_summary: ${{ steps.notification-summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test dining pipeline
        run: node --test tests/dining-hours-*.test.mjs tests/barnard-dining-hours-*.test.mjs tests/verify-live-barnard-dining.test.mjs
      - name: Collect Dining source attempts
        run: node scripts/dining-hours-scraper.mjs --json-out "$RUNNER_TEMP/dining-hours.json"
      - name: Format notification summary
        id: notification-summary
        env:
          PUBLISH_ENABLED: ${{ vars.DINING_HOURS_PUBLISH_ENABLED }}
        run: |
          summary="$(node scripts/workflow-notification-summary.mjs --kind dining --input "$RUNNER_TEMP/dining-hours.json" --publish-enabled "${PUBLISH_ENABLED:-false}")"
          {
            echo 'summary<<EOF'
            echo "$summary"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Publish validated source attempts
        if: vars.DINING_HOURS_PUBLISH_ENABLED == 'true'
        env:
          UPDATE_SECRET: ${{ secrets.LIBRARY_HOURS_UPDATE_SECRET }}
          API_URL: ${{ vars.DINING_HOURS_API_URL }}
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 3 --retry-all-errors
          -X PUT "$API_URL"
          -H "Authorization: Bearer $UPDATE_SECRET"
          -H "Content-Type: application/json"
          --data-binary "@$RUNNER_TEMP/dining-hours.json"
      - name: Verify live Barnard Dining publication
        if: vars.DINING_HOURS_PUBLISH_ENABLED == 'true'
        env:
          DINING_HOURS_API_URL: ${{ vars.DINING_HOURS_API_URL }}
        run: node scripts/verify-live-barnard-dining.mjs
  notify:
    needs: scrape-and-publish
    if: ${{ always() }}
    uses: ./.github/workflows/send-telegram-update.yml
    with:
      source_label: Dining
      conclusion: ${{ needs.scrape-and-publish.result }}
      summary: ${{ needs.scrape-and-publish.outputs.notification_summary }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      telegram_bot_token: ${{ secrets.LIONTIME_TELEGRAM_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.LIONTIME_TELEGRAM_CHAT_ID }}
